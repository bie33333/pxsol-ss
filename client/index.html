<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pxsol-ss · Solana 存储</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: #0d1117; color: #e6edf3; margin: 0; padding: 24px;
    min-height: 100vh; display: flex; justify-content: center;
  }
  .wrap { max-width: 760px; width: 100%; }
  h1 { color: #58a6ff; font-size: 22px; margin: 0 0 4px; }
  .sub { color: #8b949e; font-size: 12px; margin-bottom: 24px; word-break: break-all; }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 18px 20px; margin-bottom: 16px;
  }
  .card h2 { color: #7ee787; font-size: 14px; margin: 0 0 12px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0; font-size: 13px; }
  .row .label { color: #8b949e; flex-shrink: 0; }
  .row .val { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; word-break: break-all; text-align: right; }
  .val.green { color: #3fb950; }
  .val.yellow { color: #d29922; }
  .val.red { color: #f85149; }

  /* 大消息展示窗口 */
  .msg-box {
    background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
    padding: 20px; margin: 12px 0; min-height: 100px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .msg-box::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, #58a6ff, #7ee787, #d29922);
  }
  .msg-text {
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 18px; color: #e6edf3; text-align: center;
    word-break: break-word; white-space: pre-wrap; line-height: 1.5;
    max-width: 100%;
  }
  .msg-text.empty { color: #484f58; font-style: italic; font-size: 14px; }
  .msg-meta {
    display: flex; justify-content: space-between; font-size: 11px;
    color: #8b949e; margin-top: 8px; font-family: monospace;
  }

  button {
    background: #238636; color: #fff; border: none; border-radius: 6px;
    padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #2ea043; }
  button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
  button.secondary { background: #21262d; color: #e6edf3; }
  button.secondary:hover { background: #30363d; }
  textarea {
    width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    color: #e6edf3; padding: 10px; font-family: monospace; font-size: 13px;
    resize: vertical; min-height: 80px; outline: none;
  }
  textarea:focus { border-color: #58a6ff; }
  .actions { display: flex; gap: 10px; margin-top: 12px; }

  /* 历史时间线 */
  .history { margin-top: 8px; }
  .history-item {
    padding: 10px 12px; border-left: 3px solid #30363d;
    margin: 8px 0; background: #0d1117; border-radius: 0 6px 6px 0;
  }
  .history-item.first { border-left-color: #3fb950; }
  .history-item.expand { border-left-color: #d29922; }
  .history-item.shrink { border-left-color: #58a6ff; }
  .history-item .hi-head {
    display: flex; justify-content: space-between; font-size: 11px;
    color: #8b949e; margin-bottom: 4px;
  }
  .history-item .hi-tag { font-weight: 600; }
  .history-item.first  .hi-tag { color: #3fb950; }
  .history-item.expand .hi-tag { color: #d29922; }
  .history-item.shrink .hi-tag { color: #58a6ff; }
  .history-item .hi-body {
    font-family: monospace; font-size: 12px; color: #e6edf3;
    word-break: break-all; white-space: pre-wrap;
  }

  #log {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    padding: 12px; font-family: monospace; font-size: 11.5px;
    max-height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    color: #8b949e; margin-top: 12px;
  }
  #log .ok { color: #3fb950; }
  #log .err { color: #f85149; }
  #log .info { color: #58a6ff; }

  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .pill.connected { background: rgba(63,185,80,.15); color: #3fb950; }
  .pill.disconnected { background: rgba(248,81,73,.15); color: #f85149; }
</style>
</head>
<body>
<div class="wrap">

  <h1>pxsol-ss · 链上存储</h1>
  <div class="sub">Program: <span id="programId">—</span></div>

  <!-- 钱包 -->
  <div class="card">
    <h2>钱包</h2>
    <div class="row">
      <span class="label">状态</span>
      <span id="walletStatus" class="pill disconnected">未连接</span>
    </div>
    <div class="row">
      <span class="label">地址</span>
      <span id="walletAddr" class="val">—</span>
    </div>
    <div class="actions">
      <button id="btnConnect">连接 Phantom</button>
    </div>
  </div>

  <!-- 大消息窗口 -->
  <div class="card">
    <h2>PDA 中存储的消息</h2>
    <div class="msg-box">
      <div id="msgText" class="msg-text empty">尚未存储任何内容</div>
    </div>
    <div class="msg-meta">
      <span>PDA: <span id="pdaAddr">—</span></span>
      <span id="pdaMeta">—</span>
    </div>
    <div class="actions">
      <button id="btnRefresh" class="secondary">刷新</button>
    </div>
  </div>

  <!-- 写入 -->
  <div class="card">
    <h2>写入数据（全量覆盖）</h2>
    <textarea id="inputData" placeholder="输入要存储的内容…">hello solana storage</textarea>
    <div class="actions">
      <button id="btnWrite" disabled>写入链上</button>
    </div>
    <div id="log"></div>
  </div>

  <!-- 历史时间线 -->
  <div class="card">
    <h2>本次会话的写入历史</h2>
    <div id="history" class="history">
      <div style="color:#484f58; font-size:12px; padding:8px 0;">还没有写入记录</div>
    </div>
  </div>

</div>

<script type="module">
import {
  Connection, PublicKey, SystemProgram, SYSVAR_RENT_PUBKEY,
  Transaction, TransactionInstruction,
} from "https://esm.sh/@solana/web3.js@1.95.3";

const PROGRAM_ID = new PublicKey("4C4tdiGW8HK9jnKQDEDtqh6xuKdtPpzE5yFNREi4tNiZ");
const RPC = "http://127.0.0.1:8899";

const connection = new Connection(RPC, "confirmed");

let provider = null;
let userKey = null;
let pda = null;
let lastLamports = 0;

const $ = id => document.getElementById(id);
$("programId").textContent = PROGRAM_ID.toBase58();

function log(msg, cls = "") {
  const el = document.createElement("div");
  if (cls) el.className = cls;
  el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
}

function bytesToHex(u8) {
  return Array.from(u8).map(b => b.toString(16).padStart(2, "0")).join("");
}

function decodeData(u8) {
  try {
    return new TextDecoder("utf-8", { fatal: true }).decode(u8);
  } catch {
    return "0x" + bytesToHex(u8);
  }
}

// ---------- 钱包连接 ----------
function getProvider() {
  if ("phantom" in window) {
    const p = window.phantom?.solana;
    if (p?.isPhantom) return p;
  }
  return null;
}

async function connect() {
  provider = getProvider();
  if (!provider) {
    log("未检测到 Phantom，请安装 https://phantom.app", "err");
    return;
  }
  try {
    const resp = await provider.connect();
    userKey = resp.publicKey;

    [pda] = PublicKey.findProgramAddressSync(
      [userKey.toBuffer()],
      PROGRAM_ID
    );

    $("walletAddr").textContent = userKey.toBase58();
    $("pdaAddr").textContent = pda.toBase58();
    $("walletStatus").textContent = "已连接";
    $("walletStatus").className = "pill connected";
    $("btnConnect").textContent = "重新连接";
    $("btnWrite").disabled = false;

    log("钱包已连接: " + userKey.toBase58(), "ok");
    log("PDA: " + pda.toBase58(), "info");
    await refresh();
  } catch (e) {
    log("连接失败: " + e.message, "err");
  }
}

// ---------- 读取 PDA ----------
async function refresh() {
  if (!pda) return;
  try {
    const acc = await connection.getAccountInfo(pda);
    const textEl = $("msgText");

    if (!acc) {
      textEl.textContent = "尚未存储任何内容（PDA 未初始化）";
      textEl.className = "msg-text empty";
      $("pdaMeta").textContent = "未初始化 · lamports 0 · 0 字节";
      lastLamports = 0;
      return;
    }

    const text = decodeData(acc.data);
    if (text) {
      textEl.textContent = text;
      textEl.className = "msg-text";
    } else {
      textEl.textContent = "(空数据)";
      textEl.className = "msg-text empty";
    }

    $("pdaMeta").textContent =
      `${acc.data.length} 字节 · ${acc.lamports} lamports`;
    lastLamports = acc.lamports;
  } catch (e) {
    log("读取失败: " + e.message, "err");
  }
}

// ---------- 写入 ----------
function addHistory(text, tag, tagClass, lamportsBefore, lamportsAfter) {
  const box = $("history");
  // 首次写入时清空提示
  const placeholder = box.querySelector("div[style]");
  if (placeholder && placeholder.textContent.includes("还没有写入记录")) {
    placeholder.remove();
  }

  const item = document.createElement("div");
  item.className = "history-item " + tagClass;

  const head = document.createElement("div");
  head.className = "hi-head";
  const left = document.createElement("span");
  left.className = "hi-tag";
  left.textContent = tag;
  const right = document.createElement("span");
  right.textContent = new Date().toLocaleTimeString();
  head.appendChild(left);
  head.appendChild(right);

  const body = document.createElement("div");
  body.className = "hi-body";
  body.textContent = text || "(空)";

  const meta = document.createElement("div");
  meta.className = "hi-head";
  meta.style.marginTop = "4px";
  meta.innerHTML = `<span>lamports: ${lamportsBefore} → ${lamportsAfter}</span>`;

  item.appendChild(head);
  item.appendChild(body);
  item.appendChild(meta);

  box.insertBefore(item, box.firstChild);
}

async function write() {
  if (!provider || !userKey || !pda) return;
  const text = $("inputData").value;
  const data = new TextEncoder().encode(text);

  try {
    $("btnWrite").disabled = true;

    const beforeAcc = await connection.getAccountInfo(pda);
    const beforeLamports = beforeAcc ? beforeAcc.lamports : 0;
    const beforeLen = beforeAcc ? beforeAcc.data.length : 0;

    const ix = new TransactionInstruction({
      programId: PROGRAM_ID,
      keys: [
        { pubkey: userKey, isSigner: true,  isWritable: true  },
        { pubkey: pda,     isSigner: false, isWritable: true  },
        { pubkey: SystemProgram.programId, isSigner: false, isWritable: false },
        { pubkey: SYSVAR_RENT_PUBKEY,      isSigner: false, isWritable: false },
      ],
      data: data,
    });

    const tx = new Transaction().add(ix);
    tx.feePayer = userKey;
    tx.recentBlockhash = (await connection.getLatestBlockhash()).blockhash;

    log("等待 Phantom 签名…", "info");
    const signed = await provider.signTransaction(tx);

    log("发送交易…", "info");
    const sig = await connection.sendRawTransaction(signed.serialize());
    await connection.confirmTransaction(sig, "confirmed");
    log("交易成功: " + sig, "ok");

    await refresh();

    const afterAcc = await connection.getAccountInfo(pda);
    const afterLamports = afterAcc ? afterAcc.lamports : 0;
    const afterLen = afterAcc ? afterAcc.data.length : 0;

    // 判断走了哪条分支
    let tag, tagClass;
    if (beforeLamports === 0) {
      tag = "分支 A · 首次创建";
      tagClass = "first";
      log(`分支 A：首次创建，lamports 0 → ${afterLamports}`, "info");
    } else if (afterLen > beforeLen) {
      tag = "分支 B · 扩容 + 补租金";
      tagClass = "expand";
      log(`分支 B：扩容 ${beforeLen} → ${afterLen} 字节，补租金 +${afterLamports - beforeLamports}`, "info");
    } else if (afterLen < beforeLen) {
      tag = "分支 B · 缩容 + 退回租金";
      tagClass = "shrink";
      log(`分支 B：缩容 ${beforeLen} → ${afterLen} 字节，退回租金 ${afterLamports - beforeLamports}`, "info");
    } else {
      tag = "分支 B · 覆写（长度不变）";
      tagClass = "shrink";
      log(`分支 B：长度不变，覆写 ${afterLen} 字节`, "info");
    }

    addHistory(text, tag, tagClass, beforeLamports, afterLamports);
  } catch (e) {
    log("写入失败: " + (e.message || e), "err");
    console.error(e);
  } finally {
    $("btnWrite").disabled = false;
  }
}

// ---------- 绑定 ----------
$("btnConnect").addEventListener("click", connect);
$("btnRefresh").addEventListener("click", refresh);
$("btnWrite").addEventListener("click", write);

window.addEventListener("load", async () => {
  const p = getProvider();
  if (p && p.isConnected) {
    await connect();
  }
});
</script>
</body>
</html>
